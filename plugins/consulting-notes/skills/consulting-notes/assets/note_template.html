<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: consulting memo sheet in the house deck grammar — blue subheads with a 3px rule, navy table heads,
   square bullets, label cells on grey. Each line = content (left) + verification rail (right);
   memos and transcript quotes fold open under the line. Appendix folded by default. */
:root {
  --page: #f3f3f3;
  --sheet: #ffffff;
  --tint: #f3f3f3;
  --ink: #2b3a42;
  --ink-2: #606b71;
  --ink-3: #737b80;
  --rule: #d9d9d9;
  --rule-2: #bfbfbf;
  --blue: #00a3e0;
  --navy: #005587;
  --navy-75: #4080a5;
  --navy-25: #bfd4e1;
  --blue-25: #bfe8f7;
  --callout: #e2f5fc;
  --head-bg: #005587;
  --head-ink: #ffffff;
  --ok: #2d7a1f;
  --ok-soft: #e5f3e0;
  --warn: #8a5a00;
  --warn-soft: #fcf0d3;
  --bad: #c00000;
  --bad-soft: #f8e1e1;
  --unk-soft: #ececec;
  --mark: #fcf0d3;
  --f-body: Arial, "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --step--2: 0.75rem;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.0625rem;
  --step-2: 1.25rem;
  --step-3: 1.75rem;
  --rail-w: 13.75rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0e161b; --sheet: #15212a; --tint: #1c2a34; --ink: #e5ecf0; --ink-2: #a9b5bc; --ink-3: #8a979f;
    --rule: #2a3a45; --rule-2: #3b4e5a; --blue: #33b8ea; --navy: #7cc2ea; --navy-75: #2c6a90; --navy-25: #23465c;
    --blue-25: #173f52; --callout: #12313f; --head-bg: #0a4c73; --head-ink: #ffffff;
    --ok: #74cf62; --ok-soft: #15301a; --warn: #f0b323; --warn-soft: #33280f; --bad: #ff8080; --bad-soft: #3a1717;
    --unk-soft: #26333c; --mark: #4a3b10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0e161b; --sheet: #15212a; --tint: #1c2a34; --ink: #e5ecf0; --ink-2: #a9b5bc; --ink-3: #8a979f;
  --rule: #2a3a45; --rule-2: #3b4e5a; --blue: #33b8ea; --navy: #7cc2ea; --navy-75: #2c6a90; --navy-25: #23465c;
  --blue-25: #173f52; --callout: #12313f; --head-bg: #0a4c73; --head-ink: #ffffff;
  --ok: #74cf62; --ok-soft: #15301a; --warn: #f0b323; --warn-soft: #33280f; --bad: #ff8080; --bad-soft: #3a1717;
  --unk-soft: #26333c; --mark: #4a3b10;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 4.5rem; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 400 var(--step-0)/1.65 var(--f-body); word-break: keep-all; overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 4rem;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
a { color: var(--navy); }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* working bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  max-width: 1000px; margin: 0 auto; background: var(--sheet);
  border-bottom: 3px solid var(--blue);
  display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding: .55rem 1rem;
}
.bar nav { display: flex; gap: .25rem 1.1rem; flex-wrap: wrap; min-width: 0; flex: 1 1 22rem; font-size: var(--step--1); font-weight: 700; }
.bar nav a { color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.bar nav a:hover { color: var(--blue); }
.bar-tools { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; font-size: var(--step--1); }
.tally { display: inline-flex; gap: .3rem; }
.btn {
  font: 700 var(--step--1)/1 var(--f-body); color: var(--navy); background: var(--sheet);
  border: 1px solid var(--rule-2); border-radius: 2px; padding: .5rem .75rem; cursor: pointer;
}
.btn:hover { border-color: var(--navy); }
.switch { display: inline-flex; align-items: center; gap: .5rem; }
.switch .track { width: 2.1rem; height: 1.15rem; border-radius: 999px; background: var(--rule-2); position: relative; transition: background .15s; }
.switch .track::after {
  content: ""; position: absolute; top: .15rem; left: .15rem; width: .85rem; height: .85rem; border-radius: 50%;
  background: var(--sheet); transition: transform .15s;
}
.switch[aria-pressed="true"] .track { background: var(--navy); }
.switch[aria-pressed="true"] .track::after { transform: translateX(.95rem); }

/* sheet */
.sheet {
  max-width: 1000px; margin: 0 auto; background: var(--sheet);
  border: 1px solid var(--rule); border-top: 0;
  padding-inline: clamp(1rem, 4vw, 3rem); padding-block: clamp(1.5rem, 4vw, 2.75rem);
}
.doc-h { display: grid; gap: .45rem; padding-bottom: 1.4rem; border-bottom: 1px solid var(--rule-2); }
.eyebrow { margin: 0; display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; font-size: var(--step-0); font-weight: 700; color: var(--blue); }
.eyebrow .conf { font-size: var(--step--2); color: var(--bad); border: 1px solid currentColor; padding: .15rem .4rem; }
h1 { margin: 0; font-size: var(--step-3); line-height: 1.3; font-weight: 700; color: var(--ink); text-wrap: balance; }
.lede { margin: 0; color: var(--ink-2); max-width: 70ch; }

/* section head: numbered blue badge + blue subhead + 3px blue rule */
.sec { padding-top: 2.6rem; }
.sec-h { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; border-bottom: 3px solid var(--blue); padding-bottom: .5rem; margin-bottom: 1.1rem; }
.sec-n {
  display: inline-grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%;
  background: var(--blue); color: #fff; font-size: var(--step--1); font-weight: 700; line-height: 1; flex: none;
}
.sec-h h2, .appx-sum h2 { margin: 0; font-size: var(--step-2); font-weight: 700; color: var(--blue); }
.sec-sub { margin-left: auto; font-size: var(--step--2); font-weight: 700; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }
.sub { margin: 1.6rem 0 .5rem; font-size: var(--step-0); font-weight: 700; color: var(--navy); }

/* overview: label cells on grey, like the deck's first-column style */
.meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0; border-top: 2px solid var(--navy); }
.meta > div { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); border-bottom: 1px solid var(--rule); min-width: 0; }
.meta dt { background: var(--tint); color: var(--ink-2); font-size: var(--step--1); font-weight: 700; padding: .6rem .75rem; }
.meta dd { margin: 0; min-width: 0; padding: .55rem .75rem; }
.meta > .wide { grid-column: 1 / -1; }
.date-dd { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .6rem; }
.date-wrap time { font-weight: 700; }
.time-part { color: var(--ink-2); }
.date-hint { font-size: var(--step--2); font-weight: 700; color: var(--warn); background: var(--warn-soft); padding: .2rem .4rem; }
.date-tools { display: inline-flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.link-btn { font: 700 var(--step--2)/1 var(--f-body); color: var(--navy); background: var(--sheet); border: 1px solid var(--rule-2); border-radius: 2px; padding: .35rem .5rem; cursor: pointer; }
.link-btn:hover { border-color: var(--navy); }
#date-input { font: 400 var(--step--1)/1 var(--f-body); color: var(--ink); background: var(--sheet); border: 1px solid var(--navy); border-radius: 2px; padding: .3rem .4rem; }
.date-status { font-size: var(--step--2); color: var(--ok); font-weight: 700; }
.src-line { margin: .8rem 0 0; font-size: var(--step--2); color: var(--ink-3); }

/* item row: content | rail ; panels span both */
.items { margin: 0; padding: 0; list-style: none; display: grid; counter-reset: it; }
.it {
  display: grid; grid-template-columns: minmax(0, 1fr) var(--rail-w); column-gap: 1.25rem; align-items: start;
  position: relative; padding-block: .55rem; border-bottom: 1px solid var(--rule);
}
.items > .it:last-child { border-bottom: 0; }
ul.items > .it { padding-left: 1.1rem; }
ul.items > .it::before { content: ""; position: absolute; left: .1rem; top: calc(.55rem + .6em); width: .4rem; height: .4rem; background: var(--navy); }
ol.items > .it { counter-increment: it; padding-left: 1.6rem; }
ol.items > .it::before { content: counter(it) "."; position: absolute; left: 0; top: .55rem; font-weight: 700; line-height: 1.65; color: var(--navy); }
.item-text { margin: 0; max-width: 66ch; }
.strong { font-weight: 700; }
.tag { display: inline-block; vertical-align: .1em; margin-left: .35rem; font: 700 var(--step--2)/1 var(--f-body); color: var(--ink-3); border: 1px solid var(--rule-2); padding: .18rem .3rem; }

.rail { display: grid; grid-template-columns: 3.4rem 4.6rem minmax(0, 1fr); gap: .3rem; align-items: center; padding-top: .1rem; }
.badge, .pill, .rbtn, .slot {
  display: inline-flex; align-items: center; justify-content: center; gap: .25rem;
  font: 700 var(--step--2)/1 var(--f-body); border-radius: 2px; padding: .32rem .4rem; white-space: nowrap; min-height: 1.6rem;
}
.badge.ok, .pill.ok { color: var(--ok); background: var(--ok-soft); }
.badge.warn { color: var(--warn); background: var(--warn-soft); }
.badge.unk, .pill.unk { color: var(--ink-2); background: var(--unk-soft); }
.pill.bad { color: var(--bad); background: var(--bad-soft); }
.slot.no-src { color: var(--ink-3); font-weight: 400; }
.rbtn { cursor: pointer; border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink-2); }
.rbtn:hover, .rbtn[aria-expanded="true"] { border-color: var(--navy); color: var(--navy); }
.rbtn[aria-expanded="true"] { background: var(--blue-25); }
.src-btn { justify-content: space-between; color: var(--navy); }
.more { color: var(--ink-3); }
.chev { width: .4rem; height: .4rem; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-.1rem) rotate(45deg); transition: transform .15s; }
.rbtn[aria-expanded="true"] .chev { transform: translateY(.1rem) rotate(-135deg); }
.memo-btn .dot { width: .4rem; height: .4rem; border-radius: 50%; background: var(--warn); }

.memo, .quotes { grid-column: 1 / -1; margin-top: .55rem; padding: .6rem .8rem; font-size: var(--step--1); }
.memo { background: var(--warn-soft); border-left: 3px solid var(--warn); }
.memo-l, .quotes-h { margin: 0 0 .25rem; font: 700 var(--step--2)/1.4 var(--f-body); color: var(--navy); }
.memo-l { color: var(--warn); }
.memo-t { margin: 0; color: var(--ink); max-width: 72ch; }
.quotes { background: var(--tint); border-left: 3px solid var(--navy); display: grid; gap: .45rem; }
.qg { display: grid; gap: .15rem; }
.qg + .qg { border-top: 1px dashed var(--rule-2); padding-top: .45rem; }
.qline { display: grid; grid-template-columns: 3.2rem 6.5rem minmax(0, 1fr); gap: .6rem; align-items: baseline; }
.qt { font-weight: 700; text-decoration: none; }
.qt:hover { text-decoration: underline; }
.qs { color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qx { min-width: 0; }

/* executive summary: key-message callout + label/content matrix */
.headline { background: var(--callout); border: 0; border-left: 4px solid var(--blue); padding: .95rem 1.1rem; }
.headline .item-text { font-size: var(--step-1); font-weight: 700; line-height: 1.55; color: var(--ink); }
.headline .rbtn { background: var(--sheet); }
.es { display: grid; gap: 3px; margin-top: 1rem; }
.es-row { display: grid; grid-template-columns: 10rem minmax(0, 1fr); border-bottom: 1px solid var(--rule); }
.es-l { margin: 0; display: flex; align-items: center; padding: .75rem .9rem; background: var(--navy-75); color: #fff; font-size: var(--step--1); font-weight: 700; line-height: 1.45; }
.es-row > .items { padding-left: 1rem; }

/* agenda */
.agenda { padding-block: .2rem 1.3rem; }
.agenda + .agenda { padding-top: 1.2rem; }
.ag-h { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; padding-bottom: .4rem; border-bottom: 1px solid var(--navy); margin-bottom: .2rem; }
.ag-n { font-size: var(--step-1); font-weight: 700; color: var(--navy); }
.ag-h h3 { margin: 0; font-size: var(--step-1); font-weight: 700; color: var(--navy); text-wrap: balance; flex: 1 1 18rem; min-width: 0; }
.ag-time { font-size: var(--step--2); color: var(--ink-3); }
.kq { margin: .5rem 0; color: var(--ink-2); font-weight: 700; display: flex; gap: .5rem; align-items: baseline; }
.kq-l { font-size: var(--step--2); color: #fff; background: var(--blue); padding: .2rem .35rem; }
.ag-group { display: grid; grid-template-columns: 9rem minmax(0, 1fr); column-gap: 1rem; border-bottom: 1px solid var(--rule); }
.ag-group:last-of-type { border-bottom: 0; }
.ag-group:not(:has(.ag-gl)) { grid-template-columns: minmax(0, 1fr); }
.ag-gl { margin: 0; padding: .7rem .1rem; font-size: var(--step--1); font-weight: 700; color: var(--navy); line-height: 1.45; }
.impl { margin-top: .5rem; background: var(--callout); padding: .3rem .9rem .1rem; }
.impl-l { margin: .4rem 0 0; font: 700 var(--step--2)/1.4 var(--f-body); color: var(--blue); }
.impl .it { border-bottom: 0; padding-left: 0; }
.impl ul.items > .it::before { display: none; }
.impl .rbtn { background: var(--sheet); }
.concl { border-bottom: 2px solid var(--navy); background: var(--tint); padding: .8rem 1rem; }

/* tables: navy head, white bold text, grey hairlines */
.tbl-wrap { overflow-x: auto; margin-top: 1rem; }
table { width: 100%; border-collapse: collapse; font-size: var(--step--1); }
th { text-align: left; font-weight: 700; color: var(--head-ink); background: var(--head-bg); padding: .6rem .65rem; white-space: nowrap; }
th + th { border-left: 1px solid rgb(255 255 255 / .25); }
td { border-bottom: 1px solid var(--rule-2); padding: .65rem .65rem; vertical-align: top; }
tbody tr:nth-child(even) td { background: var(--tint); }
td.num { color: var(--navy); font-weight: 700; width: 2.2rem; text-align: center; }
.todo .cell-main { min-width: 15rem; }
.todo td:nth-child(n+3):nth-child(-n+5) { white-space: nowrap; }
.th-rail, .rail-cell { width: var(--rail-w); min-width: var(--rail-w); }
.rail-cell .rail { padding-top: 0; }
td .memo, td .quotes { margin-top: .5rem; }
.hyp .h-text { min-width: 12rem; font-weight: 700; background: var(--tint); }
.att td:first-child { white-space: nowrap; font-weight: 700; color: var(--navy); }

/* appendix (folded) */
.appx { padding-top: 2.6rem; }
.appx details { border: 1px solid var(--rule-2); background: var(--tint); }
.appx-sum { list-style: none; cursor: pointer; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; padding: .85rem 1rem; }
.appx-sum::-webkit-details-marker { display: none; }
.appx-sum .sec-n { background: var(--ink-3); }
.appx-sum h2 { color: var(--ink-2); }
.appx-desc { color: var(--ink-3); font-size: var(--step--1); }
.appx-act { margin-left: auto; font: 700 var(--step--2)/1 var(--f-body); color: var(--navy); border: 1px solid var(--rule-2); padding: .4rem .7rem; background: var(--sheet); }
.appx-act::after { content: "펼치기"; }
details[open] .appx-act::after { content: "접기"; }
.appx-body { border-top: 1px solid var(--rule-2); padding: 1.1rem 1rem; background: var(--sheet); display: grid; gap: 2rem; }
.appx-h { margin: 0 0 .6rem; display: flex; align-items: center; gap: .55rem; font-size: var(--step-1); font-weight: 700; color: var(--navy); padding-bottom: .4rem; border-bottom: 1px solid var(--navy); }
.appx-h .sec-n { background: var(--navy); width: 1.4rem; height: 1.4rem; font-size: var(--step--2); }
.appx-part > p { margin: 0 0 .6rem; }
.fc-sum { display: flex; gap: .4rem; flex-wrap: wrap; }
.muted { color: var(--ink-3); font-size: var(--step--1); }
.plain { margin: 0; padding-left: 1.1rem; display: grid; gap: .3rem; }
.script-ph { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: 1rem; border: 1px dashed var(--rule-2); color: var(--ink-2); }
.script-ph p { margin: 0; max-width: 52ch; }
.script-top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
.script-top p { margin: 0; }
.script { display: grid; margin-top: .75rem; font-size: var(--step--1); }
.sline { display: grid; grid-template-columns: 3.4rem 6.5rem minmax(0, 1fr); gap: .75rem; padding: .3rem .4rem; scroll-margin-top: 5rem; }
.sline:nth-child(even) { background: var(--tint); }
.sline.cited .sx { text-decoration: underline; text-decoration-color: var(--blue); text-underline-offset: 3px; }
.sline.hit { background: var(--mark); }
.sline.redacted { display: block; text-align: center; color: var(--ink-3); background: var(--unk-soft); padding: .5rem; margin: .25rem 0; }
.st { color: var(--navy); font-weight: 700; }
.ss { color: var(--ink-3); }
.sx { min-width: 0; }
.mono { font-weight: 700; color: var(--navy); }
.foot { max-width: 1000px; margin: .9rem auto 0; font-size: var(--step--2); color: var(--ink-2); display: grid; gap: .1rem; }
.foot p { margin: 0; }

@media (max-width: 760px) {
  .meta { grid-template-columns: minmax(0, 1fr); }
  .es-row, .ag-group { grid-template-columns: minmax(0, 1fr); }
  .es-l { padding: .45rem .75rem; }
  .es-row > .items { padding-left: .25rem; }
  .ag-gl { padding: .7rem 0 0; }
  .it { grid-template-columns: minmax(0, 1fr); row-gap: .4rem; }
  .rail { grid-template-columns: repeat(3, auto); justify-content: start; padding-top: 0; }
  .rail .slot:not(.no-src) { display: none; }
}
@media (max-width: 560px) {
  .bar { row-gap: .4rem; padding-block: .45rem; }
  .bar nav { flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: .1rem; }
  .bar nav::-webkit-scrollbar { display: none; }
  .bar-tools { width: 100%; }
  .bar .tally { display: none; }
  .sec-sub { display: none; }
  .meta > div { grid-template-columns: 5rem minmax(0, 1fr); }
  .qline { grid-template-columns: 3.2rem minmax(0, 1fr); }
  .qline .qx { grid-column: 1 / -1; }
  .sline { grid-template-columns: 3.2rem minmax(0, 1fr); }
  .sline .sx { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  .bar, .btn, .rbtn, .link-btn, .script-ph, .appx-act { display: none !important; }
  body { background: #fff; }
  .sheet { border: 0; }
  th, .es-l, .sec-n { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>

<div class="bar" role="toolbar" aria-label="노트 도구">
  <nav aria-label="섹션">{{NAV}}</nav>
  <div class="bar-tools">
    <span class="tally" aria-label="팩트체크 결과"><span class="badge ok">일치 {{FC_OK}}</span><span class="badge warn">확인 {{FC_WARN}}</span></span>
    <button type="button" class="btn" id="expand-all" aria-pressed="false">원문·메모 모두 펼치기</button>
    <button type="button" class="btn switch" data-toggle-script aria-pressed="false" id="script-toggle"><span class="track" aria-hidden="true"></span>스크립트 원문</button>
  </div>
</div>

<main class="sheet">
{{BODY}}
</main>
<footer class="foot"><p>Note: 오른쪽 시각은 녹음 기준. 화자 표시는 문맥 추정이며, 원문 표기는 자동 전사 그대로임</p><p>Source: 녹음 자동 전사, 팩트체크 후 작성</p></footer>

<script>
(function () {
  /* panels: memo · transcript quotes */
  function setPanel(btn, open) {
    var p = document.getElementById(btn.getAttribute("aria-controls"));
    if (!p) return;
    p.hidden = !open;
    btn.setAttribute("aria-expanded", String(open));
  }
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest(".rbtn");
    if (b) { setPanel(b, b.getAttribute("aria-expanded") !== "true"); return; }
    var a = ev.target.closest('a[href^="#s"]');
    if (a) { ev.preventDefault(); goScript(a.getAttribute("href").slice(1)); return; }
    var n = ev.target.closest('.bar nav a[href="#appendix"]');
    if (n && appx) appx.open = true;
  });
  var all = document.getElementById("expand-all");
  if (all) all.addEventListener("click", function () {
    var open = all.getAttribute("aria-pressed") !== "true";
    all.setAttribute("aria-pressed", String(open));
    all.textContent = open ? "원문·메모 모두 접기" : "원문·메모 모두 펼치기";
    document.querySelectorAll(".rbtn").forEach(function (b) { setPanel(b, open); });
  });

  /* appendix + script toggle */
  var appx = document.getElementById("appx");
  var KEY = "consulting-note-script";
  var script = document.getElementById("script");
  var ph = document.getElementById("script-placeholder");
  var toggles = document.querySelectorAll("[data-toggle-script]");
  function setScript(on, save) {
    if (!script) return;
    script.hidden = !on;
    if (ph) ph.hidden = on;
    toggles.forEach(function (t) { if (t.id === "script-toggle") t.setAttribute("aria-pressed", String(on)); });
    if (on && appx) appx.open = true;
    if (save) { try { localStorage.setItem(KEY, on ? "1" : "0"); } catch (e) {} }
  }
  function goScript(id) {
    setScript(true, true);
    var line = document.getElementById(id);
    if (!line) return;
    document.querySelectorAll(".sline.hit").forEach(function (l) { l.classList.remove("hit"); });
    line.classList.add("hit");
    line.scrollIntoView({ block: "center" });
  }
  var start = false;
  try { start = localStorage.getItem(KEY) === "1"; } catch (e) {}
  setScript(start, false);
  if (!start && appx) appx.open = false;
  toggles.forEach(function (t) { t.addEventListener("click", function () { setScript(script.hidden, true); }); });
  if (/^#s\d+$/.test(location.hash)) goScript(location.hash.slice(1));
  else if (/^#(appendix|notes|appendix-script)$/.test(location.hash) && appx) appx.open = true;

  /* meeting date: calendar edit. Published page → shared store (everyone sees it); file → this browser only */
  var wrap = document.getElementById("meet-date");
  if (!wrap) return;
  var text = document.getElementById("date-text"), input = document.getElementById("date-input");
  var edit = document.getElementById("date-edit"), hint = document.getElementById("date-hint");
  var status = document.getElementById("date-status");
  var WD = "일월화수목금토", LK = "consulting-note-date:" + wrap.dataset.key, db = null;
  function valid(v) { return typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v); }
  function show(v) {
    if (!valid(v)) return;
    var d = new Date(v + "T00:00:00");
    text.textContent = v + " (" + WD[d.getDay()] + ")";
    text.setAttribute("datetime", v);
    input.value = v;
    if (hint) hint.hidden = true;
  }
  function openEditor(on) {
    input.hidden = !on;
    edit.textContent = on ? "닫기" : "날짜 수정";
    edit.setAttribute("aria-expanded", String(on));
    if (on) { input.focus(); try { input.showPicker(); } catch (e) {} }
  }
  try { var lv = localStorage.getItem(LK); if (valid(lv)) show(lv); } catch (e) {}
  edit.addEventListener("click", function () { openEditor(input.hidden); });
  input.addEventListener("keydown", function (ev) { if (ev.key === "Escape") openEditor(false); });
  input.addEventListener("change", function () {
    var v = input.value;
    if (!valid(v)) return;
    show(v);
    openEditor(false);
    if (db) {
      status.textContent = "저장 중…";
      db.doc("note/meta").set({ date: v }).then(function () {
        status.textContent = "저장됨 · 링크를 보는 모두에게 반영";
      }, function () {
        status.textContent = "수정 권한이 없어 이 화면에서만 바뀜";
      });
    } else {
      var ok = false;
      try { localStorage.setItem(LK, v); ok = true; } catch (e) {}
      status.textContent = ok ? "이 브라우저에만 저장됨" : "저장되지 않음 · 새로고침하면 원래 날짜로 돌아감";
    }
  });
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("db").then(function (d) {
      if (!d) return;
      db = d;
      d.doc("note/meta").onSnapshot(function (s) {
        var v = s.exists && s.data() && s.data().date;
        if (valid(v)) show(v);
      }, function () {});
      return window.claude.use("user").then(function (u) {
        if (!u) return;
        return u.can("data.write").then(function (w) { if (w === false) edit.hidden = true; });
      });
    }).catch(function () {});
  }
})();
</script>

<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one document sheet, sticky working bar (sections · fact-check tally · script toggle), sources fold open under each line. */
:root {
  --paper: #f3f5f8;
  --sheet: #ffffff;
  --ink: #17202e;
  --ink-2: #4c5668;
  --ink-3: #7b8597;
  --rule: #dce1e9;
  --accent: #27467f;
  --accent-soft: #e7edf8;
  --ok: #1d6f53;
  --ok-soft: #e1f2ea;
  --warn: #9a5506;
  --warn-soft: #fbefdc;
  --bad: #a3322b;
  --bad-soft: #f9e4e2;
  --unk-soft: #eceef2;
  --mark: #fff1b8;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.0625rem;
  --step-2: 1.3125rem;
  --step-3: 1.875rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1117; --sheet: #151a22; --ink: #e3e7ee; --ink-2: #a5aebc; --ink-3: #7c8697;
    --rule: #2a313d; --accent: #92b1ee; --accent-soft: #1c2740; --ok: #5ec79c; --ok-soft: #11281e;
    --warn: #e8a64c; --warn-soft: #2d210f; --bad: #ef8a83; --bad-soft: #2e1614; --unk-soft: #232934; --mark: #4a3f12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1117; --sheet: #151a22; --ink: #e3e7ee; --ink-2: #a5aebc; --ink-3: #7c8697;
  --rule: #2a313d; --accent: #92b1ee; --accent-soft: #1c2740; --ok: #5ec79c; --ok-soft: #11281e;
  --warn: #e8a64c; --warn-soft: #2d210f; --bad: #ef8a83; --bad-soft: #2e1614; --unk-soft: #232934; --mark: #4a3f12;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 4.5rem; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 var(--step-0)/1.7 var(--f-body); letter-spacing: -0.005em;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 4rem;
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* working bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  max-width: 880px; margin: 0 auto; background: var(--paper);
  border-bottom: 1px solid var(--rule);
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; padding-block: 0.6rem;
}
.bar nav { display: flex; gap: 0.25rem 0.9rem; flex-wrap: wrap; min-width: 0; flex: 1 1 22rem; font-size: var(--step--1); }
.bar nav a { color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.bar nav a:hover { color: var(--accent); }
.bar-tools { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; font-size: var(--step--1); }
.tally { display: inline-flex; gap: 0.35rem; }
.btn {
  font: 500 var(--step--1)/1 var(--f-body); color: var(--ink); background: var(--sheet);
  border: 1px solid var(--rule); border-radius: 999px; padding: 0.45rem 0.8rem; cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.switch { display: inline-flex; align-items: center; gap: 0.5rem; }
.switch .track {
  width: 2.1rem; height: 1.2rem; border-radius: 999px; background: var(--rule); position: relative; transition: background .15s;
}
.switch .track::after {
  content: ""; position: absolute; top: 0.15rem; left: 0.15rem; width: 0.9rem; height: 0.9rem; border-radius: 50%;
  background: var(--sheet); box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: transform .15s;
}
.switch[aria-pressed="true"] .track { background: var(--accent); }
.switch[aria-pressed="true"] .track::after { transform: translateX(0.9rem); }

/* sheet */
.sheet {
  max-width: 880px; margin: 1.25rem auto 0; background: var(--sheet);
  border: 1px solid var(--rule); border-radius: 6px;
  padding-inline: clamp(1rem, 4vw, 3rem); padding-block: clamp(1.5rem, 4vw, 2.75rem);
}
.doc-h { padding-bottom: 1.25rem; border-bottom: 2px solid var(--ink); }
.eyebrow { margin: 0; font: 500 var(--step--1)/1.4 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { margin: .35rem 0 0; font-size: var(--step-3); line-height: 1.3; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.lede { margin: .6rem 0 0; color: var(--ink-2); max-width: 65ch; }

.sec { padding-top: 2.25rem; }
.sec-h { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding-bottom: .5rem; margin-bottom: 1rem; }
.sec-n { font: 500 var(--step--1)/1 var(--f-mono); color: var(--accent); min-width: 1.6rem; }
.sec-h h2 { margin: 0; font-size: var(--step-2); font-weight: 700; letter-spacing: -0.015em; }
.sec-sub { margin-left: auto; font: 400 var(--step--1)/1 var(--f-mono); color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
h3.sub { margin: 1.5rem 0 .5rem; font-size: var(--step--1); font-weight: 600; letter-spacing: .06em; color: var(--ink-2); text-transform: uppercase; }

/* overview */
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: .6rem 2rem; margin: 0; }
.meta div { display: grid; grid-template-columns: 5.5rem 1fr; gap: .75rem; min-width: 0; }
.meta dt { color: var(--ink-3); font-size: var(--step--1); padding-top: .15rem; }
.meta dd { margin: 0; min-width: 0; }
.src-line { margin: 1rem 0 0; font-size: var(--step--1); color: var(--ink-3); }

/* items */
.items { margin: 0; padding: 0; list-style: none; display: grid; gap: .9rem; counter-reset: it; }
ol.items > li { counter-increment: it; position: relative; padding-left: 1.75rem; }
ol.items > li::before { content: counter(it); position: absolute; left: 0; top: .1rem; font: 500 var(--step--1)/1.6 var(--f-mono); color: var(--accent); }
ul.items > li { position: relative; padding-left: 1.1rem; }
ul.items > li::before { content: ""; position: absolute; left: .15rem; top: .72em; width: .35rem; height: .35rem; border-radius: 50%; background: var(--ink-3); }
.item-text { margin: 0; max-width: 68ch; }
.strong { font-weight: 600; }
.src-row { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; margin-top: .35rem; }
.badge, .tag, .pill {
  display: inline-flex; align-items: center; font: 500 0.75rem/1 var(--f-body); border-radius: 4px; padding: .3rem .45rem; white-space: nowrap;
}
.badge.ok, .pill.ok { color: var(--ok); background: var(--ok-soft); }
.badge.warn { color: var(--warn); background: var(--warn-soft); }
.badge.unk, .pill.unk { color: var(--ink-2); background: var(--unk-soft); }
.pill.bad { color: var(--bad); background: var(--bad-soft); }
.tag { color: var(--ink-2); border: 1px solid var(--rule); }
.cite {
  display: inline-flex; align-items: center; gap: .35rem; cursor: pointer;
  font: 500 0.75rem/1 var(--f-body); color: var(--accent); background: var(--accent-soft);
  border: 1px solid transparent; border-radius: 4px; padding: .28rem .45rem;
}
.cite:hover, .cite[aria-expanded="true"] { border-color: var(--accent); }
.cite-t { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.cite-s { color: var(--ink-2); }
.check-note { margin: .35rem 0 0; font-size: var(--step--1); color: var(--warn); max-width: 68ch; }
.quotes { margin-top: .55rem; border-left: 2px solid var(--accent); background: var(--paper); border-radius: 0 4px 4px 0; padding: .55rem .75rem; display: grid; gap: .3rem; }
.quotes-h { margin: 0 0 .15rem; font-size: 0.75rem; color: var(--ink-3); }
.qline { display: grid; grid-template-columns: auto auto 1fr; gap: .6rem; align-items: baseline; font-size: var(--step--1); border-radius: 3px; padding: .1rem .25rem; }
.qline.focus { background: var(--mark); }
.qt { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-decoration: none; }
.qs { color: var(--ink-3); white-space: nowrap; }
.qx { min-width: 0; }

/* summary blocks */
.headline { padding: 1rem 1.1rem; background: var(--accent-soft); border-radius: 6px; }
.headline-t { margin: 0; font-size: var(--step-1); font-weight: 600; line-height: 1.6; max-width: 68ch; }
.sowhat, .impl, .concl { margin-top: 1.1rem; padding-top: .9rem; border-top: 1px dashed var(--rule); }
.sowhat-l, .impl-l { margin: 0 0 .2rem; font: 600 0.75rem/1.4 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.concl { border-top: 0; padding-top: 0; margin-top: 0; }

/* agenda */
.agenda + .agenda { margin-top: 1.75rem; }
.ag-h { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; margin-bottom: .6rem; }
.ag-n { font: 600 var(--step--1)/1 var(--f-mono); color: var(--sheet); background: var(--ink); border-radius: 3px; padding: .25rem .4rem; }
.ag-h h3 { margin: 0; font-size: var(--step-1); font-weight: 600; text-wrap: balance; }
.ag-time { margin-left: auto; font: 400 var(--step--1)/1 var(--f-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.kq { margin: 0 0 .75rem; font-weight: 500; color: var(--ink-2); }

/* tables */
.tbl-wrap { overflow-x: auto; margin-top: 1rem; }
table { width: 100%; border-collapse: collapse; font-size: var(--step--1); }
th { text-align: left; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--ink); padding: .5rem .6rem; white-space: nowrap; }
td { border-bottom: 1px solid var(--rule); padding: .65rem .6rem; vertical-align: top; }
td.num { font-family: var(--f-mono); color: var(--accent); width: 2rem; }
.todo td:nth-child(2) { min-width: 16rem; }
.todo td:nth-child(n+3) { white-space: nowrap; }
.hyp .h-text { min-width: 12rem; font-weight: 500; }
.att td:first-child { white-space: nowrap; color: var(--ink-2); }
.mono { font-family: var(--f-mono); }

/* appendix */
.fc-sum { display: flex; gap: .4rem; flex-wrap: wrap; }
.muted { color: var(--ink-3); font-size: var(--step--1); }
.plain { margin: 0; padding-left: 1.1rem; display: grid; gap: .3rem; }
.script-ph { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: 1rem; border: 1px dashed var(--rule); border-radius: 6px; color: var(--ink-2); }
.script-ph p { margin: 0; max-width: 52ch; }
.script { display: grid; gap: 0; margin-top: .75rem; font-size: var(--step--1); }
.sline { display: grid; grid-template-columns: 3.4rem 6.5rem 1fr; gap: .75rem; padding: .3rem .4rem; border-radius: 3px; scroll-margin-top: 5rem; }
.sline:nth-child(even) { background: var(--paper); }
.sline.cited .sx { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.sline:target { background: var(--mark); }
.sline.redacted { display: block; text-align: center; color: var(--ink-3); background: var(--unk-soft); padding: .5rem; margin: .25rem 0; }
.st { font-family: var(--f-mono); color: var(--accent); font-variant-numeric: tabular-nums; }
.ss { color: var(--ink-3); }
.sx { min-width: 0; }
.foot { max-width: 880px; margin: 1rem auto 0; font-size: 0.75rem; color: var(--ink-3); }

@media (max-width: 560px) {
  .bar { row-gap: .4rem; padding-block: .45rem; }
  .bar nav { flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: .1rem; }
  .bar nav::-webkit-scrollbar { display: none; }
  .bar-tools { width: 100%; }
  .bar .tally { display: none; }
  .btn { padding: .4rem .7rem; }
  .sec-sub { display: none; }
  .meta div { grid-template-columns: 4.5rem 1fr; }
  .qline { grid-template-columns: auto 1fr; }
  .qline .qx { grid-column: 1 / -1; }
  .sline { grid-template-columns: 3.2rem 1fr; }
  .sline .sx { grid-column: 1 / -1; }
  .ag-time { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  .bar, .btn, .script-ph { display: none !important; }
  body { background: #fff; }
  .sheet { border: 0; }
}
</style>

<div class="bar" role="toolbar" aria-label="노트 도구">
  <nav aria-label="섹션">{{NAV}}</nav>
  <div class="bar-tools">
    <span class="tally" aria-label="팩트체크 결과"><span class="badge ok">일치 {{FC_OK}}</span><span class="badge warn">확인 {{FC_WARN}}</span></span>
    <button type="button" class="btn" id="expand-all" aria-pressed="false">출처 모두 펼치기</button>
    <button type="button" class="btn switch" data-toggle-script aria-pressed="false" id="script-toggle"><span class="track" aria-hidden="true"></span>스크립트 원문</button>
  </div>
</div>

<main class="sheet">
{{BODY}}
</main>
<p class="foot">출처 칩의 시각은 녹음 기준이다. 화자 표시는 문맥 추정이며 원문 표기는 자동 전사 그대로다.</p>

<script>
(function () {
  var KEY = "consulting-note-script";
  var script = document.getElementById("script");
  var ph = document.getElementById("script-placeholder");
  var toggles = document.querySelectorAll("[data-toggle-script]");
  function setScript(on, save) {
    if (!script) return;
    script.hidden = !on;
    if (ph) ph.hidden = on;
    toggles.forEach(function (t) { t.setAttribute("aria-pressed", String(on)); });
    if (save) { try { localStorage.setItem(KEY, on ? "1" : "0"); } catch (e) {} }
  }
  var start = false;
  try { start = localStorage.getItem(KEY) === "1"; } catch (e) {}
  if (/^#s\d+$/.test(location.hash)) start = true;
  setScript(start, false);
  toggles.forEach(function (t) { t.addEventListener("click", function () { setScript(script.hidden, true); }); });

  function setPanel(panel, open, ref) {
    panel.hidden = !open;
    document.querySelectorAll('.cite[aria-controls="' + panel.id + '"]').forEach(function (c) {
      c.setAttribute("aria-expanded", String(open && (!ref || c.dataset.ref === ref)));
    });
    panel.querySelectorAll(".qline").forEach(function (l) {
      l.classList.toggle("focus", !!ref && open && l.dataset.ref === ref);
    });
  }
  document.addEventListener("click", function (ev) {
    var c = ev.target.closest(".cite");
    if (c) {
      var panel = document.getElementById(c.getAttribute("aria-controls"));
      if (!panel) return;
      var same = c.getAttribute("aria-expanded") === "true";
      setPanel(panel, !same, c.dataset.ref);
      return;
    }
    var a = ev.target.closest('a[href^="#s"]');
    if (a && script && script.hidden) setScript(true, true);
  });
  var all = document.getElementById("expand-all");
  if (all) all.addEventListener("click", function () {
    var open = all.getAttribute("aria-pressed") !== "true";
    all.setAttribute("aria-pressed", String(open));
    all.textContent = open ? "출처 모두 접기" : "출처 모두 펼치기";
    document.querySelectorAll(".quotes").forEach(function (p) { setPanel(p, open, null); });
  });
})();
</script>
